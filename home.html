<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Praticando JS</title>
</head>
<body>
    <main>
        <h1>Praticando Java Script!</h1>

        <section>
            <h2>Trocar um nome na tela:</h2>
            <input type="text" id="nome-entrada" placeholder="Informe seu nome:">
            <button id="btn-troca">Trocar nome</button>
            <p>Olá <b id="nome-saida">Visitante</b>!</p>
        </section>

        <section>
            <h2>Alterando a cor da caixa</h2>
            <div id="caixa">Aqui é a caixa</div>
            <button id="btn-verde" class="btn">Verde</button>
            <button id="btn-amarelo" class="btn">Amarelo</button>
            <button id="btn-azul" class="btn">Azul</button>
        </section>
    </main>


   <script src="praticandojs/home.js"></script>
</body>
</html>
