<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Área de Login</title>
</head>
<body>
    <main>

        <section class="sessao-imagem">
            <img src="img/img-login.jpg" alt="Casal numa livraria">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Match<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias.</h2>
            </div>

            <form action="#" id="form-login">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome:" required>

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Digite seu email:" required>

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite um nome de usuario:">

                <div class="cadastro-senha">
                    <div>
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="Digite sua senha:" required>
                    </div>
                    
                    <div>
                        <label for="confirmar-senha">Confirme sua senha:</label>
                        <input type="text" id="confirmar-senha" placeholder="Repita sua senha:" required>
                    </div>
                
                </div>

                <p id="msg-erro"></p>
            
                <button id="btn-cadastrar" type="button"> Acessar </button>

            </form>
        </section>
    </main>

        <script src="praticandojs/cadastro.js"></script>
</body>
</html>
