<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Área de Login</title>
</head>
<body>
    <main>

        <section class="sessao-imagem">
            <img src="img/img-login.jpg" alt="Casal numa livraria">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Match<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias.</h2>
            </div>

            <form action="#" method="post" id="form-login">

                <label for="email">Digite seu email:</label>
                <input type="email" id="senha" placeholder="Digite seu email:">

                <label for="senha">Digite sua senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha:">

                <div class="links-senha">
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha"> Lembrar senha </label>
                    
                    <a href="index.html" id="link-esqueceu-senha"> Esqueceu a senha? </a>
                </div>

                <button id="btn-acessar"> Acessar </button>
                <a href="cadastro.html" id="link-nao-conta"> Ainda não possuo uma conta </a>

            </form>
        </section>
    </main>

</body>
</html>
