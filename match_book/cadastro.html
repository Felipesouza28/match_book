<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Área de Login</title>
</head>
<body>
    <main>

        <section class="sessao-imagem">
            <img src="img/img-login.jpg" alt="Casal numa livraria">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Match<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias.</h2>
            </div>

            <form action="#" method="post" id="form-login">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome:">

                <label for="email">Email:</label>
                <input type="email" id="senha" placeholder="Digite seu email:">

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite um nome de usuario:">

                <div class="cadastro-senha">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha:">

                    <label for="confirmar-senha">Confirme sua senha:</label>
                    <input type="text" id="confirmar-senha" placeholder="Repita sua senha:">

                </div>
                

                <button id="btn-acessar"> Acessar </button>

            </form>
        </section>
    </main>

</body>
</html>
